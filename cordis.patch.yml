# ============================================================================
# dsh-coke 的 bundle patch —— 把这只猫挂进 DSH 配置树
# ============================================================================
# insert：往配置树里加一行插件 entry
#   id   行标识，必须全局唯一并且和包名一致（商城/插件管理按它比对 entryIds）
#   name 模块名，解析到 package.json 的 main（lib/index.js，宿主半侧）
# 因为 package.json 声明了 dsh.client，DSH 的模块系统同时会把它当作浏览器插件，
# 提供 /plugins/dsh-coke/client.js 给页面。
# 注意：`id:` 那一行不要写行尾注释，商城预检用正则抓这一行的值。
# ============================================================================

- insert:
    - id: dsh-coke
      name: 'dsh-coke'
